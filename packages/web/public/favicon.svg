  <line x1="712" y1="535" x2="850" y2="765" stroke="#9BB6C9" stroke-width="26" marker-end="url(#fav-arrow-muted)"/>

  <!-- Nodes -->
  <circle cx="500" cy="190" r="46" fill="#FFFFFF"/>
