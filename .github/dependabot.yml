version: 2
updates:
  # Maintain dependencies for npm monorepo (root + npm workspaces)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      prod-dependencies:
        dependency-type: 'production'

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns:
          - '*'
