name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment (beta or production)'
        required: true
        type: string
      stack_prefix:
        description: 'Prefix for CDK stacks (Beta or Prod)'
        required: true
        type: string
      bucket_name:
        description: 'Target S3 bucket for web assets'
        required: true
        type: string
      domain:
        description: 'Primary domain for CloudFront invalidation and smoke tests'
        required: true
        type: string
    secrets:
      aws_role_arn:
        description: 'IAM Role ARN for AWS OIDC authentication'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build -w @brwyatt/web

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Deploy CDK Stacks
        run: |
          npx cdk deploy BrwyattMe-${{ inputs.stack_prefix }} BrwyattMe-${{ inputs.stack_prefix }}-Redirects --require-approval never
        working-directory: packages/infra

      - name: Sync Static Assets to S3
        run: |
          aws s3 sync packages/web/dist "s3://${{ inputs.bucket_name }}" --delete

      - name: Invalidate CloudFront Cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, '${{ inputs.domain }}')].Id | [0]" --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi

      - name: Run Smoke Tests
        run: bash scripts/smoke-test.sh https://${{ inputs.domain }}
